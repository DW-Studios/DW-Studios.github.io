<!DOCTYPE html>

    <button id="closeButton">Watch chapter 4 part 1 full gameplay</button>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            setTimeout(function() {
                document.getElementById("closeButton").style.opacity = "1";
            }, 3000);
        });

        document.getElementById("closeButton").addEventListener("click", function() {
            if (window.history.length > 1) {
                window.history.back(); // Volver a la página anterior si hay historial
            } else {
                window.open('', '_self').close(); // Intentar cerrar si es posible
            }
        });
