<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Coming Soon</title>

    <style>
        /* FUENTE PERSONALIZADA */
        @font-face {
            font-family: 'KGLegoHouse';
            src: url('Fonts/KGLegoHouse.woff2') format('woff2'),
                 url('Fonts/KGLegoHouse.woff') format('woff');
        }

        body {
            margin: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            color: #fff;
            font-family: 'KGLegoHouse', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            cursor: pointer;
        }

        #start {
            position: absolute;
            font-size: 2.5rem;
            opacity: 0.85;
            text-align: center;
        }

        #countdown {
            display: none;
            font-size: 4rem;
            text-align: center;
        }

        #coming-soon {
            display: none;
            position: fixed;
            bottom: 20px;
            left: 20px;
            font-size: 1.2rem;
            opacity: 0.75;
        }

        video {
            display: none;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div id="start">Click to start</div>
    <div id="countdown">10:00</div>
    <div id="coming-soon">Coming Soon</div>

    <!-- VIDEO -->
    <video id="finalVideo" src="video.mp4" playsinline></video>

    <script>
        let timeLeft = 1 * 10; // 10 minutos

        const start = document.getElementById("start");
        const countdownEl = document.getElementById("countdown");
        const comingSoonEl = document.getElementById("coming-soon");
        const video = document.getElementById("finalVideo");

        start.addEventListener("click", () => {
            start.style.display = "none";
            countdownEl.style.display = "block";
            comingSoonEl.style.display = "block";

            const timer = setInterval(() => {
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;

                countdownEl.textContent =
                    `${minutes}:${seconds.toString().padStart(2, "0")}`;

                timeLeft--;

                if (timeLeft < 0) {
                    clearInterval(timer);

                    countdownEl.style.display = "none";
                    comingSoonEl.style.display = "none";

                    video.style.display = "block";
                    video.muted = false;
                    video.play();
                }
            }, 1000);
        }, { once: true });
    </script>

</body>
</html>
