<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Coming Soon</title>

    <!-- Fuente -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            color: #fff;
            font-family: 'KGLegoHouse', KHLegoHouse;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #countdown {
            font-size: 4rem;
            font-weight: 600;
            text-align: center;
        }

        #coming-soon {
            position: fixed;
            bottom: 20px;
            left: 20px;
            font-size: 1.2rem;
            font-weight: 300;
            opacity: 0.75;
        }
    </style>
</head>
<body>

    <div id="countdown">Cargando...</div>
    <div id="coming-soon">Coming Soon</div>

    <script>
        const targetDate = new Date("February 10, 2026 00:00:00").getTime();

        const timer = setInterval(() => {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance <= 0) {
                clearInterval(timer);
                document.getElementById("countdown").innerHTML = "¡Ya disponible!";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("countdown").innerHTML =
                `${days}d ${hours}h ${minutes}m ${seconds}s`;
        }, 1000);
    </script>

</body>
</html>
