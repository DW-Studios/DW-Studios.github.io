<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Coming Soon</title>

    <style>
        /* FUENTE PERSONALIZADA */
        @font-face {
            font-family: 'KGLegoHouse';
            src: url('Fonts/KGLegoHouse.woff2') format('woff2'),
                 url('Fonts/KGLegoHouse.woff') format('woff');
        }

        body {
            margin: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            color: #fff;
            font-family: 'KGLegoHouse', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #countdown {
            font-size: 4rem;
            text-align: center;
        }

        #coming-soon {
            position: fixed;
            bottom: 20px;
            left: 20px;
            font-size: 1.2rem;
            opacity: 0.75;
        }

        video {
            display: none;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div id="countdown">05:00</div>
    <div id="coming-soon">Coming Soon</div>

    <!-- VIDEO -->
    <video id="finalVideo" src="rickroll.mp4"></video>

    <script>
        let timeLeft = 5 * 60; // 10 minutos en segundos

        const countdownEl = document.getElementById("countdown");
        const comingSoonEl = document.getElementById("coming-soon");
        const video = document.getElementById("finalVideo");

        const timer = setInterval(() => {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;

            countdownEl.textContent =
                `${minutes}:${seconds.toString().padStart(2, "0")}`;

            timeLeft--;

            if (timeLeft < 0) {
                clearInterval(timer);

                // Ocultar texto
                countdownEl.style.display = "none";
                comingSoonEl.style.display = "none";

                // Mostrar y reproducir video
                video.style.display = "block";
                video.play();
            }
        }, 1000);
    </script>

</body>
</html>
